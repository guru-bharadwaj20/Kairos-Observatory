# K-12.08: build a release and publish it as a GitHub release.
# Triggered by pushing a tag such as v0.1.0. The sdist and wheel are attached to
# the release; install with `pip install <wheel URL>` or from git.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version and the changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uvx --python 3.12 --from toml-cli toml get --toml-path pyproject.toml project.version)"
          test "$tag" = "$version" || { echo "tag $tag != pyproject $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG has no $version"; exit 1; }
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release with changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "KAIROS $GITHUB_REF_NAME" --notes-file notes.md
