[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kairos-observatory"
version = "0.0.1"
description = "An open early-warning observatory for runaway AI: Prophet null models, singularity detectors and a pre-registered forecast ledger."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "guru-bharadwaj20" }]
requires-python = ">=3.12,<3.13"
keywords = ["forecasting", "prophet", "neuralprophet", "ai-safety", "singularity", "early-warning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # numerics (numpy<2 is required by neuralprophet 0.9, see CONTRIBUTING D12)
    "numpy>=1.26,<2",
    "pandas>=2.2,<2.3",
    "scipy>=1.13",
    "statsmodels>=0.14.2",
    # forecasting
    "prophet>=1.1.6",
    "neuralprophet==0.9.0",
    "torch>=2.4",
    "kaleido==0.2.1",
    # compute
    "joblib>=1.4",
    "threadpoolctl>=3.5",
    "psutil>=6.0",
    # data
    "pandera>=0.20",
    "pyarrow>=17",
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # config and CLI
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    # plotting
    "plotly>=5.22",
    "plotly-resampler>=0.10",  # silences neuralprophet plotting import errors
    "matplotlib>=3.9",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.560"]
dashboard = ["streamlit>=1.38"]
ots = ["opentimestamps-client>=0.7.1"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML>=6.0",
    "types-psutil>=6.0",
]

[project.scripts]
kairos = "kairos.cli:main"

[project.urls]
Homepage = "https://github.com/guru-bharadwaj20/Kairos-Observatory"
Issues = "https://github.com/guru-bharadwaj20/Kairos-Observatory/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kairos"]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "PT", "NPY", "PD", "D"]
ignore = [
    "D105", "D107",  # magic methods / __init__ docstrings
    "D203", "D213",  # conflicting pydocstyle rules
    "RUF001", "RUF002", "RUF003",  # Greek letters (δ, κ, λ) are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
