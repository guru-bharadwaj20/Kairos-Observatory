# KAIROS public policy parameters (Jonas rule: published, versioned, never literals in code).
#
# Changing any value here is a policy change: bump `version`, record the reason in
# `changelog`, and register the new version in the forecast ledger before it is used.
version: "1.0.0"
changelog:
  - version: "1.0.0"
    date: 2026-11-06
    note: >-
      Initial values. lambda = 9 means a missed catastrophe is judged nine times as
      costly as a false alarm, so a dial alarms once P(danger) > 1/(1+9) = 0.10.

jonas:
  # Asymmetric loss ratio: cost(missed danger) / cost(false alarm). Must be > 0.
  lambda: 9.0
  # Hysteresis below the alarm threshold, in probability units. A dial that is in
  # danger stands down only when P(danger) < 1/(1+lambda) - band.
  band: 0.03
  # Consecutive weekly readings needed before a dial changes state.
  dwell: 2

# When each dial counts as "in danger" (KAIROS_Project_Idea.md section 8). P(danger) is
# the share of a dial's bootstrap/ensemble draws (DialReading.detail["samples"]) on
# the danger side of `threshold`.
danger:
  acceleration: {direction: above, threshold: 0.0}  # delta > 0: super-exponential
  recursion: {direction: above, threshold: 0.0}     # trend of kappa across windows > 0
  vinge: {direction: below, threshold: 0.0}         # trend of h* < 0: horizon shrinking
  jonas: {direction: above, threshold: 0.0}         # dG/dt > 0, sustained

# Rawls maximin: decide in the worst *plausible* scenario of the ensemble.
rawls:
  # A scenario is plausible when its normalised ensemble weight is at least this.
  # Equal-weight ensembles of up to 20 members keep every member.
  min_weight: 0.05

# Collingridge lead time: months until the upper-quantile forecast crosses a threshold.
collingridge:
  quantile: 0.95   # Jonas acts on the upper quantile, not the median
  ci: 0.90         # width of the reported interval on the lead time
  n_boot: 1000     # bootstrap resamples of the forecast paths

# Intervention-cost curve: relative cost of an effective intervention made L months
# before the threshold is crossed:  cost(L) = floor + (1 - floor) * exp(-L / tau).
# Assumptions (Collingridge 1980), all deliberately simple and open to challenge:
#   * cost is relative: 1.0 = acting at the crossing itself (L = 0);
#   * cost falls monotonically with lead time: earlier action meets less entrenchment;
#   * entrenchment decays exponentially with time scale `tau` (months), set to about
#     one frontier-model generation;
#   * a `floor` remains however early one acts (institutions, evaluation, compliance).
intervention_cost:
  tau: 18.0
  floor: 0.1
